spring:
  application:
    name: healthconnect

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/healthconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Testing@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  # JPA / Hibernate Config
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates/updates tables
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # SQL initialization
  sql:
    init:
      mode: always
      continue-on-error: true

  # Servlet & File Upload Configuration (Required for Medical Records)
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB
      file-size-threshold: 2KB

  # Email Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@healthconnect.com}

# JSON Web Token (JWT) Configuration
jwt:
  # Secret key MUST be minimum 256 bits for HS256 algorithm
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnoughThisIsToBeUsedInHealthConnectApp2023ForTestingAndShouldBeAtLeast256Bits
  expiration: 3600000 # 1 hour in milliseconds for access tokens
  refresh-expiration: 604800000 # 7 days in milliseconds for refresh tokens

# Application Specific Configurations
app:
  cors:
    allowed-origins: http://localhost:8080,http://localhost:3000
    
  upload:
    dir: uploads/records
    dir-prescriptions: uploads/prescriptions
  
  mail:
    from-name: HealthConnect
    support-email: support@healthconnect.com

# Logging levels
logging:
  level:
    root: INFO
    com.digitalclinic: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

# WebSocket Configuration
websocket:
  allowed-origins: http://localhost:8080,http://localhost:3000

